[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-lohc-workflows"
version = "0.1.0"
description = "Manifest-driven Gaussian and LOHC thermochemistry workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gbemi Abass"}]

[project.scripts]
lohcflow = "lohcflow.cli:main"

[tool.setuptools.packages.find]
include = ["lohcflow*"]
